[platformio]
default_envs = halloween

[env:halloween]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_GIF=1
    -DLV_USE_STDLIB_MALLOC=1
    -DLV_USE_FS_STDIO=0
    -DLV_USE_LOG=0
lib_deps =
    https://github.com/lvgl/lvgl.git#v9.3.0
    https://github.com/knolleary/pubsubclient.git#v2.8
